name: Backend unit tests

on:
  push:
    branches: [main, integrate/**]
    paths:
      - 'backend-lambda/**'
      - '.github/workflows/backend-test.yml'
  pull_request:
    paths:
      - 'backend-lambda/**'
      - '.github/workflows/backend-test.yml'
  workflow_dispatch:

jobs:
  jest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-lambda
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend-lambda/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # The table reporter also writes the results to the run's Summary page
      - name: Jest (rooms)
        run: npm test -- --ci
        env:
          FORCE_COLOR: '1'
