AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Room Reservation facilities API on Lambda and API Gateway REST.

Parameters:
  PrivateSubnetIds:
    Type: CommaDelimitedList
    Description: Terraform private_subnet_ids output, comma-separated.
  LambdaSecurityGroupId:
    Type: AWS::EC2::SecurityGroup::Id
    Description: Terraform lambda_security_group_id output.
  DatabaseUrl:
    Type: String
    NoEcho: true
    Description: Full PostgreSQL URL, including username, password, port, database name, and sslmode=require.
  AllowedOrigins:
    Type: String
    Default: http://localhost:5173
    Description: Comma-separated browser origins allowed by the API.
  StageName:
    Type: String
    Default: dev
  S3BucketName:
    Type: String
    Default: roomreserve-images-use1
    Description: >-
      Bucket that room photos are uploaded to. Must be in the same region as the stack, because
      the Lambdas reach S3 through the VPC's S3 gateway endpoint; needs a CORS rule allowing POST
      from the frontend.
  S3PublicUrl:
    Type: String
    Default: https://roomreserve-images-use1.s3.us-east-1.amazonaws.com
    Description: Base URL that room photo object keys are appended to.
  CognitoUserPoolArn:
    Type: String
    Default: arn:aws:cognito-idp:us-east-1:568318158381:userpool/us-east-1_IRgcDe04c
    Description: Cognito user pool whose ID tokens the API accepts.

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 15
    MemorySize: 512
    VpcConfig:
      SubnetIds: !Ref PrivateSubnetIds
      SecurityGroupIds:
        - !Ref LambdaSecurityGroupId
    Environment:
      Variables:
        STAGE: !Ref StageName
        DATABASE_URL: !Ref DatabaseUrl
        ALLOWED_ORIGINS: !Ref AllowedOrigins
        S3_PUBLIC_URL: !Ref S3PublicUrl
        S3_BUCKET: !Ref S3BucketName

Resources:
  FacilitiesApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub roomres-${StageName}-api
      StageName: !Ref StageName
      EndpointConfiguration: REGIONAL
      # Every route needs a Cognito ID token unless its event sets Auth: NONE
      Auth:
        DefaultAuthorizer: CognitoAuthorizer
        Authorizers:
          CognitoAuthorizer:
            UserPoolArn: !Ref CognitoUserPoolArn
      # Errors API Gateway returns itself (e.g. 401 from the authorizer) never reach
      # the Lambda's CORS middleware, so add the headers here or browsers hide the status
      GatewayResponses:
        DEFAULT_4XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: method.request.header.origin
              Access-Control-Allow-Credentials: "'true'"
        DEFAULT_5XX:
          ResponseParameters:
            Headers:
              Access-Control-Allow-Origin: method.request.header.origin
              Access-Control-Allow-Credentials: "'true'"

  FacilitiesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-facilities-${StageName}
      CodeUri: dist/facilities/
      Handler: index.handler
      Description: Facilities CRUD API.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        FacilitiesCollection:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/facilities
            Method: ANY
        FacilitiesItems:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/facilities/{proxy+}
            Method: ANY
        FacilitiesCollectionPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/facilities
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        FacilitiesItemsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/facilities/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        FacilitiesCollectionRead:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/facilities
            Method: GET
            Auth:
              Authorizer: NONE
        FacilitiesItemsRead:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/facilities/{proxy+}
            Method: GET
            Auth:
              Authorizer: NONE

  HealthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-health-${StageName}
      CodeUri: dist/health/
      Handler: index.handler
      MemorySize: 256
      Description: Health check including a database ping.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        Health:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/health
            Method: ANY
            Auth:
              Authorizer: NONE

  RoomsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-rooms-${StageName}
      CodeUri: dist/rooms/
      Handler: index.handler
      Description: Rooms list and detail API.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
        # Presigning needs PutObject rights; deleting an uploaded photo needs DeleteObject.
        # From the VPC (no NAT) DeleteObject also needs an S3 gateway VPC endpoint.
        - S3CrudPolicy:
            BucketName: !Ref S3BucketName
      Events:
        RoomsCollection:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/rooms
            Method: ANY
        RoomsItems:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/rooms/{proxy+}
            Method: ANY
        RoomsCollectionPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/rooms
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        RoomsItemsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/rooms/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        RoomsCollectionRead:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/rooms
            Method: GET
            Auth:
              Authorizer: NONE
        RoomsItemsRead:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/rooms/{proxy+}
            Method: GET
            Auth:
              Authorizer: NONE

  BookingsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-bookings-${StageName}
      CodeUri: dist/bookings/
      Handler: index.handler
      Description: Bookings by date range API.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        BookingsCollection:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/bookings
            Method: ANY
        BookingsItems:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/bookings/{proxy+}
            Method: ANY
        BookingsCollectionPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/bookings
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        BookingsItemsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/bookings/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        BookingsCollectionRead:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/bookings
            Method: GET
            Auth:
              Authorizer: NONE

  UsersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-users-${StageName}
      CodeUri: dist/users/
      Handler: index.handler
      Description: Current user (GET /api/users/me).
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        UsersCollection:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/users
            Method: ANY
        UsersItems:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/users/{proxy+}
            Method: ANY
        UsersCollectionPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/users
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        UsersItemsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/users/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  StatsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-stats-${StageName}
      CodeUri: dist/stats/
      Handler: index.handler
      Description: Weekly usage stats (GET /api/stats/weekly, ADMIN only).
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole
      Events:
        StatsCollection:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/stats
            Method: ANY
        StatsItems:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/stats/{proxy+}
            Method: ANY
        StatsCollectionPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/stats
            Method: OPTIONS
            Auth:
              Authorizer: NONE
        StatsItemsPreflight:
          Type: Api
          Properties:
            RestApiId: !Ref FacilitiesApi
            Path: /api/stats/{proxy+}
            Method: OPTIONS
            Auth:
              Authorizer: NONE

  # Not behind API Gateway. Run migrations with:
  #   aws lambda invoke --function-name roomres-migrate-<stage> --payload '{}' out.json
  MigrateFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub roomres-migrate-${StageName}
      CodeUri: dist/migrate/
      Handler: index.handler
      Timeout: 120
      Description: Runs Drizzle migrations against the VPC database.
      Policies:
        - AWSLambdaBasicExecutionRole
        - AWSLambdaVPCAccessExecutionRole

  # Copy this resource when adding another Lambda. Globals.Function already
  # supplies the VPC config, runtime, timeout, memory, and shared environment.
  # Replace the name, CodeUri, and API paths with the new function's values.
  # ExampleFunction:
  #   Type: AWS::Serverless::Function
  #   Properties:
  #     FunctionName: !Sub roomres-example-${StageName}
  #     CodeUri: dist/example/
  #     Handler: index.handler
  #     Description: Example resource Lambda.
  #     Policies:
  #       - AWSLambdaBasicExecutionRole
  #       - AWSLambdaVPCAccessExecutionRole
  #     Events:
  #       ExampleCollection:
  #         Type: Api
  #         Properties:
  #           RestApiId: !Ref FacilitiesApi
  #           Path: /api/example
  #           Method: ANY
  #       ExampleItems:
  #         Type: Api
  #         Properties:
  #           RestApiId: !Ref FacilitiesApi
  #           Path: /api/example/{proxy+}
  #           Method: ANY

Outputs:
  ApiBaseUrl:
    Description: Base URL for the deployed REST API stage.
    Value: !Sub https://${FacilitiesApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}/${StageName}
  FacilitiesFunctionName:
    Description: Deployed Lambda function name.
    Value: !Ref FacilitiesFunction
